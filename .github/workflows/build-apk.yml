name: Build Ramaj Wtsapp Cleaner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ramaj-Wtsapp-Cleaner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramaj-Wtsapp-Cleaner-APK
          path: Ramaj-Wtsapp-Cleaner.apk
